user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # DNS resolver for Docker service discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Upstream servers - use resolve parameter for dynamic DNS resolution
    upstream api_backend {
        server api:8000 resolve;
        keepalive 16;
    }

    upstream frontend_backend {
        server frontend:3000 resolve;
        keepalive 8;
    }

    upstream voice_engine_backend {
        server voice-engine:8001 resolve;
        keepalive 8;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name ominivoice.local;

        # Allow ACME challenge for mkcert
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name ominivoice.local;

        # SSL Configuration (mkcert certificates)
        ssl_certificate /etc/nginx/ssl/ominivoice.local.pem;
        ssl_certificate_key /etc/nginx/ssl/ominivoice.local-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_off_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (for local, short max-age)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check (no auth, no rate limit)
        location /health {
            access_log off;
            proxy_pass http://api_backend/health;
        }

        location /metrics {
            proxy_pass http://api_backend/metrics;
        }

        # Auth endpoints (stricter rate limit)
        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=120 nodelay;
            proxy_pass http://api_backend;
        }

        # Webhook endpoints
        location /webhook/ {
            limit_req zone=webhook_limit burst=100 nodelay;
            proxy_pass http://api_backend;
        }

        # Voice Engine WebSocket (demo calls - session-based)
        location /demo/ws/ {
            proxy_pass http://voice_engine_backend;
        }

        # Agent WebSocket (external dialer integrations - COMMON endpoint for all agents)
        location /ws/ {
            proxy_pass http://voice_engine_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Voice Engine REST API (demo calls)
        location /demo/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://voice_engine_backend;
        }

        # Frontend (Vite dev server)
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_backend;
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;
}