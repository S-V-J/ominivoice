version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ominivoice-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ominivoice}
      POSTGRES_USER: ${POSTGRES_USER:-ominivoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ominivoice} -d ${POSTGRES_DB:-ominivoice}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - ominivoice-internal
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: ominivoice-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ominivoice-internal
    restart: unless-stopped

  # Backend API (FastAPI)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    container_name: ominivoice-api
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ominivoice}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ominivoice}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOICE_WEBHOOK_SECRET:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1
      - OLLAMA_BASE_URL=http://ollama:11434
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - STT_ENGINE=${STT_ENGINE:-faster-whisper}
      - VOICE_ENGINE_URL=http://voice-engine:8001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - ominivoice-internal
      - ominivoice-external
    restart: unless-stopped

  # Celery Worker for Background Jobs
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    container_name: ominivoice-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ominivoice}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ominivoice}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1
      - OLLAMA_BASE_URL=http://ollama:11434
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - STT_ENGINE=${STT_ENGINE:-faster-whisper}
      - VOICE_ENGINE_URL=http://voice-engine:8001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - ominivoice-internal
    restart: unless-stopped

  # Celery Beat for Scheduled Tasks
  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    container_name: ominivoice-scheduler
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ominivoice}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ominivoice}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celery_beat_data:/app/celerybeat-schedule
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - ominivoice-internal
    restart: unless-stopped
  voice-engine:
    build:
      context: ../voice_engine
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    container_name: ominivoice-voice-engine
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1
      - NGC_API_KEY=${NGC_API_KEY}
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - STT_ENGINE=${STT_ENGINE:-faster-whisper}
      - KOKORO_MODEL_PATH=/models/kokoro-v0_19.onnx
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
      # Stack B NIM endpoints
      - RIVA_ASR_GRPC_ENDPOINT=voice-riva-asr:50051
      - CHATTERBOX_GRPC_ENDPOINT=voice-chatterbox:50051
      - RIVA_ASR_USE_SSL=false
      - CHATTERBOX_USE_SSL=false
      - RIVA_ASR_LANGUAGE=en-US
      - CHATTERBOX_LANGUAGE=en-US
      - CHATTERBOX_EMOTION_EXAGGERATION=0.5
    ports:
      - "8001:8001"
    volumes:
      - voice_models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
      voice-riva-asr:
        condition: service_healthy
      voice-chatterbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - ominivoice-internal
      - ominivoice-external
    restart: unless-stopped
    # GPU support (uncomment for GPU-enabled hosts)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Chatterbox TTS NIM (Stack B - Text-to-Speech)
  voice-chatterbox:
    image: nvcr.io/nim/nvidia/chatterbox-tts-multilingual:latest
    container_name: ominivoice-voice-chatterbox
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50052:50051"
      - "9001:9000"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ominivoice-internal
    restart: unless-stopped

  # Riva ASR NIM (Stack B - Speech-to-Text)
  voice-riva-asr:
    image: nvcr.io/nim/nvidia/riva-asr:latest
    container_name: ominivoice-voice-riva-asr
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50051:50051"
      - "9000:9000"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ominivoice-internal
    restart: unless-stopped

  # Riva VAD uses the same ASR container (Riva ASR includes VAD capabilities)

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost/ws}
    container_name: ominivoice-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - ominivoice-external
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ominivoice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - api
      - frontend
      - voice-engine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    networks:
      - ominivoice-external
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local
  voice_models:
    driver: local
  frontend_static:
    driver: local

networks:
  ominivoice-internal:
    driver: bridge
    internal: false
  ominivoice-external:
    driver: bridge